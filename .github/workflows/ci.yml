name: NexChat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexchat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node.js 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run release test suite
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
